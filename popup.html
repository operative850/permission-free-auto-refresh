<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Permission-free Auto Refresh</title>
<script src="theme.js"></script>
<style>
  :root {
    --bg: #17191f;
    --field: #22262e;
    --seg: #1c1f26;
    --border: #2f343e;
    --fg: #e9ebf0;
    --muted: #8f97a5;
    --accent: #3b7cf6;
    --accent-hover: #2f6ce0;
    --danger: #f05252;
    --ok: #34d399;
    --row: #1f232a;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --field: #f3f4f6;
    --seg: #ffffff;
    --border: #dfe2e7;
    --fg: #1b1d22;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4fd8;
    --danger: #dc2626;
    --ok: #059669;
    --row: #f7f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; width: 330px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  header img { width: 26px; height: 26px; border-radius: 6px; }
  header h1 { font-size: 14px; font-weight: 700; margin: 0; flex: 1; letter-spacing: 0.1px; white-space: nowrap; }
  .icon-btn {
    width: 30px; height: 30px; display: grid; place-items: center;
    background: var(--field); border: 1px solid var(--border); border-radius: 8px;
    color: var(--fg); cursor: pointer; padding: 0;
  }
  .icon-btn:hover { border-color: var(--muted); }
  .icon-btn svg { width: 15px; height: 15px; }
  .label { font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .seg {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--seg);
  }
  .seg button {
    border: 0; border-left: 1px solid var(--border); background: transparent; color: var(--fg);
    padding: 8px 0; font: inherit; cursor: pointer;
  }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .every { display: flex; align-items: center; gap: 8px; }
  .every input {
    flex: 1; min-width: 0; padding: 9px 11px; font: inherit; font-size: 14px;
    background: var(--field); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
  }
  .every input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .every span { color: var(--muted); width: 58px; }
  .status {
    display: flex; align-items: center; gap: 7px; margin-top: 14px; padding: 9px 11px;
    background: var(--field); border-radius: 8px; color: var(--muted); font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.running { color: var(--fg); }
  .status.running .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .primary {
    width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
  }
  .primary:hover { background: var(--accent-hover); }
  .ghost {
    width: 100%; margin-top: 8px; padding: 9px; border-radius: 9px; cursor: pointer;
    background: transparent; color: var(--danger); border: 1px solid var(--danger); font: inherit; font-weight: 600;
  }
  .hidden { display: none !important; }
  .active-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 6px; }
  .active-head .label { margin: 0; }
  .link { background: none; border: 0; color: var(--danger); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 11px;
    background: var(--row); border: 1px solid var(--border); border-radius: 8px;
  }
  .row .meta { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 12.5px; }
  .row .name em { font-style: normal; color: var(--accent); font-weight: 600; margin-left: 4px; font-size: 11px; }
  .row .sub { color: var(--muted); font-size: 11.5px; }
  .row .icon-btn { width: 26px; height: 26px; border-radius: 7px; }
  .row .icon-btn svg { width: 13px; height: 13px; }
  .row .stop { color: var(--danger); }
  .err { color: var(--danger); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Permission-free Auto Refresh</h1>
    <button id="theme" class="icon-btn" title="Toggle light / dark"></button>
  </header>

  <div class="label">Time unit</div>
  <div class="seg" id="units">
    <button data-u="s">Seconds</button>
    <button data-u="m">Minutes</button>
    <button data-u="h">Hours</button>
    <button data-u="d">Days</button>
  </div>

  <div class="label">Refresh every</div>
  <div class="every">
    <input id="value" type="number" min="1" step="1" value="30">
    <span id="unitWord">seconds</span>
  </div>

  <div id="status" class="status"><span class="dot"></span><span id="statusText">Not running on this tab</span></div>
  <div id="err" class="err hidden"></div>

  <button id="start" class="primary">Start refreshing this tab</button>
  <button id="stop" class="ghost hidden">Stop this tab</button>

  <div id="activeWrap" class="hidden">
    <div class="active-head">
      <div class="label" id="activeLabel">Active tabs</div>
      <button id="stopAll" class="link">Stop all</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
